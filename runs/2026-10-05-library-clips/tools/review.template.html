    const tone = n ? toneOf(n.flow_kind, n.state, n.level) : 'neutral';
    return `<article class="card" data-key="${esc(k)}">
      <div class="crow"><span class="num">${c.i}</span>${c.timestamp ? `<button type="button" class="time" data-vid="${esc(v.id)}" data-i="${c.i}" data-s="${toSec(c.timestamp)}" aria-pressed="false" title="${t('play')} ${esc(c.timestamp)}${c.timestamp_end ? ' – ' + esc(c.timestamp_end) : ''}">${esc(c.timestamp)}</button>` : ''}<span class="kind">${esc(c.kind)}${n && n.flow_kind !== c.kind ? ' → ' + esc(n.flow_kind) : ''}</span>${n ? `<span class="tone tone-${tone}">${esc(L[lang].statesLbl[n.state] || n.state)} · ${t('level')} ${n.level}</span>` : ''}</div>
      <p class="said"><span class="lab" style="font-size:11px;color:var(--faint)">${t('said')}:</span> ${esc(c.quote)}</p>
      <div class="cols">
        <div class="col"><p class="h">${t('old')}</p>${o.text_ar || o.text_en ? `<p>${esc(pick(o.text_ar, o.text_en))}</p><p class="meta">${t('ofOld')}: ${esc(o.verdict || '')} · ${esc(o.standing || '')}${o.grading ? ' · ' + esc(o.grading) : ''}${o.corrected ? ' · corrected' : ''}${o.published === false ? ' · held' : ''}${o.url ? ` · <a href="${esc(o.url)}" target="_blank" rel="noopener">↗</a>` : ''}</p>` : `<p class="meta">${t('none')}</p>`}</div>
        <div class="col new"><p class="h">${t('neu')}</p>${n ? `<p>${esc(pick(n.line_ar, n.line_en))}</p>${n.load_bearing ? '<p class="meta">' + t('load') + '</p>' : ''}${pick(n.note_ar, n.note_en) ? `<p class="meta" style="color:var(--goldText);font-weight:700">${esc(pick(n.note_ar, n.note_en))}</p>` : ''}${n.corrected_by ? `<p class="meta">${t('corr')}: ${esc(n.corrected_by)}</p>` : ''}<details class="why"><summary>${t('why')}</summary><p>${esc(pick(n.reason_ar, n.reason_en))}${pick(n.harm_basis_ar, n.harm_basis_en) ? ' — ' + esc(pick(n.harm_basis_ar, n.harm_basis_en)) : ''}</p></details>` : `<p class="meta">—</p>`}</div>
      </div>
      ${n ? `<h3 style="margin-top:10px">${t('parts')} (${n.parts.length})</h3>${partsHtml(n)}` : ''}
      <div class="acts"><button type="button" class="btn" data-v="accept" aria-pressed="false">${t('accept')}</button><button type="button" class="btn" data-v="edit" aria-pressed="false">${t('edit')}</button><button type="button" class="btn" data-v="reject" aria-pressed="false">${t('reject')}</button></div>
      <textarea class="editbox" hidden placeholder="${t('editHint')}" aria-label="${t('editHint')}"></textarea>
      <div class="saved" aria-live="polite"></div></article>`;
  }
  function renderAll() {
    document.body.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang;
    $('lang-ar').setAttribute('aria-pressed', String(lang === 'ar')); $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
    $('h1').textContent = t('h1'); $('sub').textContent = t('sub'); $('note').textContent = DATA.note ? pick(DATA.note.ar, DATA.note.en) : '';
    $('chips').innerHTML = DATA.videos.map((v) => `<button type="button" class="chip" role="tab" data-vid="${esc(v.id)}" aria-selected="false" title="${esc(v.title)}">${esc(v.title).slice(0, 34)}<b id="cnt-${esc(v.id)}">0/${v.claims.length}</b></button>`).join('');
    $('sections').innerHTML = DATA.videos.map((v) => `<section id="sec-${esc(v.id)}" hidden><h2>${esc(v.title)}</h2><p class="sub">${esc(v.speaker || '')} · ${v.claims.length} ${t('claims')}</p>${v.claims.map((c) => claimCard(v, c)).join('')}</section>`).join('');
    const all = DATA.videos.flatMap((v) => v.claims.filter((c) => c.new));
    const tally = {}; for (const c of all) tally[c.new.state] = (tally[c.new.state] || 0) + 1;
    $('stats').innerHTML = Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<span class="stat">${esc(L[lang].statesLbl[s] || s)}: ${n}</span>`).join('') + `<span class="stat">${all.length} ${t('claims')}</span>`;
    applyState(); applyPills(); playerLabels();
    for (const [k, b] of state) { const card = document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); const box = card && card.querySelector('.editbox'); if (box && b.edit && !box.value) box.value = b.edit; }
  }
  function applyState() {
    for (const card of document.querySelectorAll('.card[data-key]')) { const b = state.get(card.dataset.key); const v = b ? b.decision : null; card.dataset.state = v ? 'decided' : ''; for (const btn of card.querySelectorAll('.btn')) btn.setAttribute('aria-pressed', String(btn.dataset.v === v)); const box = card.querySelector('.editbox'); if (box) box.hidden = v !== 'edit'; }
    let all = 0, done = 0;
    for (const v of DATA.videos) { const n = v.claims.filter((c) => state.has(key(v.id, c.i))).length; all += v.claims.length; done += n; const c = $('cnt-' + v.id); if (c) c.textContent = n + '/' + v.claims.length; }
    const cur = DATA.videos.find((v) => v.id === current); const one = cur && cur.claims.every((c) => state.has(key(cur.id, c.i)));
    $('done').hidden = !(done === all || one); $('done').textContent = done === all ? t('done') : t('doneOne');
  }
  function show(vid) { if (playing && playing.vid !== vid) stopPlayer(); current = vid; for (const c of document.querySelectorAll('.chip')) c.setAttribute('aria-selected', String(c.dataset.vid === vid)); for (const s of document.querySelectorAll('#sections > section')) s.hidden = s.id !== 'sec-' + vid; try { localStorage.setItem('deeni-v2-vid', vid); } catch {} applyState(); }
  function mark(card, msg) { const el = card.querySelector('.saved'); if (el) el.textContent = msg; }
  async function save(k, body, card) { state.set(k, body); applyState(); if (!db) { mark(card, dbAbsent ? t('unsaved') : t('saving')); return; } mark(card, t('saving')); try { await db.doc('claims/' + k).set(body); mark(card, t('saved')); } catch { mark(card, t('unsaved')); } }
  function clear(k, card) { state.delete(k); applyState(); mark(card, ''); if (db) db.doc('claims/' + k).delete().catch(() => {}); }
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip'); if (chip) { show(chip.dataset.vid); return; }
    const tp = e.target.closest('.time'); if (tp) { const i = Number(tp.dataset.i); if (playing && playing.vid === tp.dataset.vid && playing.i === i) { stopPlayer(); return; } seek(tp.dataset.vid, i, Number(tp.dataset.s), tp.textContent.trim()); return; }
    if (e.target.closest('#phide')) { stopPlayer(); return; }
    const btn = e.target.closest('.btn'); if (!btn) return; const card = btn.closest('.card'); const k = card.dataset.key, v = btn.dataset.v; const cur = state.get(k);
    if (cur && cur.decision === v) { clear(k, card); return; }
    const box = card.querySelector('.editbox'); const body = { decision: v, at: new Date().toISOString() }; if (v === 'edit') body.edit = box.value; save(k, body, card); if (v === 'edit') setTimeout(() => box.focus(), 0);
  });
  document.addEventListener('input', (e) => { const box = e.target.closest('.editbox'); if (!box) return; const card = box.closest('.card'); const k = card.dataset.key; clearTimeout(timers.get(k)); timers.set(k, setTimeout(() => save(k, { decision: 'edit', edit: box.value, at: new Date().toISOString() }, card), 700)); });
  $('lang').addEventListener('click', (e) => { const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return; lang = b.dataset.lang; try { localStorage.setItem('deeni-v2-lang', lang); } catch {} renderAll(); show(current || DATA.videos[0].id); });
  renderAll(); let start = DATA.videos[0].id; try { const s = localStorage.getItem('deeni-v2-vid'); if (s && DATA.videos.some((v) => v.id === s)) start = s; } catch {} show(start);
  (async () => {
    db = await window.claude?.use?.('db');
    if (!db) { dbAbsent = true; return; }
    db.collection('claims').onSnapshot((snap) => { for (const d of snap.docs) { const b = d.data(); if (b && b.decision) state.set(d.id, b); } for (const ch of snap.docChanges()) if (ch.type === 'removed') state.delete(ch.doc.id); applyState(); for (const [k, b] of state) { const card = document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); const box = card && card.querySelector('.editbox'); if (box && b.edit && document.activeElement !== box) box.value = b.edit; } }, () => {});
  })();
</script>

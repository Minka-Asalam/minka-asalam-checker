  html { scroll-behavior: smooth; }
  body { background: var(--ground); color: var(--text); font: 16px/1.85 var(--ar); padding-inline: 16px; padding-block: 0 80px; }

  .langswitch button[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .sub { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }

  .crow { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

  .time { font: inherit; font-size: 12.5px; font-weight: 700; color: var(--goldText); background: var(--goldbg); border: 0; border-radius: 999px; padding: 1px 10px; cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.7; }

  .time[aria-pressed="true"] { background: var(--ink); color: var(--ground); }
  .time:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .player { position: fixed; inset-inline-end: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: clamp(240px, 46vw, 380px); z-index: 20; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 28px rgba(0, 0, 0, .22); overflow: hidden; }

nd no grading of the chain.","load_bearing":true,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"هي المفترض أن تكون لكل كتاب أجل، يعني الكتاب مثلا التوراة له أجل إلى مجيء الإنجيل ثم انتهى، والإنجيل إلى مجيء القرآن ثم ينتهي، والقرآن يستمر إلى يوم القيامة ثم ينتهي","text_ar":"من المفسرين من قال: معنى «لكل أجل كتاب» لكل كتاب منزَّل أجلٌ ينتهي إليه.","text_en":"Some exegetes said that «for every term there is a decree» means every revealed book has a term it runs to.","flow_kind":"report","exit_id":"x_reported","state":"matches","level":3,"difference_ar":"مرويّ في تفسير الطبري · لم نقف على حكمٍ لإسناده عند المحكِّمين المعتمدين","difference_en":"Reported in Tafsir al-Tabari · we found no grading of its chain by the accepted graders","source":{"site":"usul.ai","link":"https://usul.ai/t/tafsir-al-tabari-jami-al-bayan/9065?versionId=OdKMqDaKpW","quote":"وقد قيل: معناه: لكل كتابٍ أنزله الله من السماء أجَلٌ… عن الضحاك في قوله: (لكلّ أجل كتاب)، يقول: لكل كتاب ينزل من السماء أجل، فيمحُو الله من ذلك ما يشاءُ ويُثْبت، وعنده أمُّ الكتاب.","collection":null,"number":null,"grader":null,"grading":null,"narrator":"الضحاك","work_ar":"جامع البيان عن تأويل آي القرآن (تفسير الطبري)","ref_ar":"ج16 ص476","volume":"16","page":476,"page_url":"https://usul.ai/t/tafsir-al-tabari-jami-al-bayan/9065?versionId=OdKMqDaKpW","confirm_url":"https://usul.ai/t/tafsir-al-baghawi/1258?versionId=2Ne0qTu9VW","gradings":null},"search_log":[{"source":"continuation tool against 13:38 verse_text","query":"claim 3 quote","found":false},{"source":"usul.ai tafsir-al-tabari-jami-al-bayan","query":"لكل كتاب أجل","found":true},{"source":"usul.ai tafsir-al-baghawi","query":"لكل كتاب أجل","found":true},{"source":"usul.ai tafsir-al-baghawi","query":"لكل كتاب أجل التوراة الإنجيل","found":false},{"source":"sceptic: usul-online page 9064 (Tabari) and 1257 (Baghawi) re-printed","query":"quote checked on Tabari vol 16 p.476; Baghawi vol 3 p.26 carries «وقيل: فيه تقديم وتأخير… لكل كتاب أجل»","found":true ification he retells","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «وأجمعت الأمة على أن الربا محرم».","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «وأجمعت الأمة على أن الربا محرم» (the community agreed that riba is forbidden).","source":{"site":"usul.ai","link":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/1466?versionId=5HK0y3GSR2","quote":"وَهُوَ مُحَرَّمٌ بِالْكِتَابِ، وَالسُّنَّةِ، وَالْإِجْمَاعِ … وَأَجْمَعَتْ الْأُمَّةُ عَلَى أَنَّ الرِّبَا مُحَرَّمٌ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"المغني لابن قدامة","ref_ar":"باب الربا والصرف","volume":"4","page":3,"page_url":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/1466?versionId=5HK0y3GSR2","confirm_url":null,"gradings":null},"search_log":[{"source":"usul.ai toc (al-mughni)","query":"الربا","found":true},{"source":"usul.ai page (al-mughni) apiIndex 1465","query":"باب الربا والصرف vol 4 p.3","found":true}]}]}}]},{"id":"4cbf4efe-d4b4-41f2-b2d7-03678e1b4d8e","title":"الصديق","speaker":"الشيخ ياسر الدوسري","claims":[{"i":1,"kind":"saying","timestamp":"00:02","timestamp_end":"00:27","quote":"الصديق الصالح هو الذي تستحي أن تفعل معصية أمامه وصديق السوء هو الذي تستحي أن تفعل طاعة أمامه هذا مقياس يفرز لك الناس","old":null,"new":{"i":1,"flow_kind":"report","sub_kind":"saying","state":"not_a_claim","level":0,"line_ar":"تعريف المتحدث للصديق الصالح وصديق السوء مقياسًا، دون نسبته لأحد","line_en":"The speaker's own measure of a righteous versus a bad friend, attributed to no one and citing no source.","reason_ar":"قاله المتحدث رأيًا ومقياسًا من عنده ولم ينسبه إلى أحد، فليس خبرًا منقولًا يُفحَص.","reason_en":"Told as the speaker's own measure and lesson with no attribution, so it is not a transmitted report to check.","load_bearing":true,"continues":null,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"الصديق الصالح هو الذي تستحي أن تفعل معصية أمامه وصديق السوء هو الذي تستحي أن تفعل طاعة أمامه هذا مقياس يفرز لك الناس","text_ar":"الصديق الصالح من تستحي أن تعصي الله أمامه، وصديق السوء من تستحي أن تطيع الله أمامه، وهذا مقياس تعرف به الناس.","text_en":"A righteous friend is one before whom you are ashamed to sin; a bad friend is one before whom you are ashamed to obey; this is a measure for sorting people.","flow_kind":"report","exit_id":"x_not_a_claim","state":"not_a_claim","level":0,"difference_ar":"رأيٌ للمتحدث لا خبرٌ منقول؛ لا يُفحَص ولا يُنشَر له سطر.","difference_en":"The speaker's own view, not a transmitted report; not checked, no row published.","source":{"site":null,"link":null,"quote":null,"collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[]}]}}]},{"id":"9d35dee0-ea59-4cdf-bc36-75bedc443e12","title":"You Grew It, They Ate It","speaker":"إسماعيل بن موسى منك","claims":[{"i":1,"kind":"hadith","timestamp":"00:14","timestamp_end":"00:31","quote":"go and read the hadith of al-Muflis, go and read the hadith of the bankrupt person, he has a lot of salah, a lot of zakah, a lot of ibadah, but he slandered this one, he belittled that one, he abused that one, he ate the wealth of this one, and all those good deeds were done for someone else","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":1,"line_ar":"حديث المفلس يوم القيامة، رواه المتحدث بالمعنى، وهو في صحيح مسلم","line_en":"The hadith of the bankrupt one on the Day of Judgment, retold by meaning; it is in Sahih Muslim 2581.","reason_ar":"حديث متصل في صحيح مسلم (2581) من رواية أبي هريرة، فهو صحيح؛ رواه المتحدث بالإنجليزية بالمعنى دون أن يغيّره.","reason_en":"A connected hadith in Sahih Muslim 2581, narrated by Abu Hurayra, so it is sahih; the speaker retold it in English by meaning and kept its sense.","load_bearing":true,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"go and read the hadith of al-Muflis, go and read the hadith of the bankrupt person, he has a lot of salah, a lot of zakah, a lot of ibadah, but he slandered this one, he belittled that one, he abused that one, he ate the wealth of this one, and all those good deeds were done for someone else","text_ar":"المفلس من الأمة من يأتي يوم القيامة بصلاة وصيام وزكاة، وقد شتم هذا وقذف هذا وأكل مال هذا، فيُعطى هؤلاء من حسناته.","text_en":"The bankrupt one of the Ummah comes on the Day of Judgment with prayer, fasting and zakah, but has abused, slandered and taken wealth from people, so his good deeds are given to them.","flow_kind":"hadith","exit_id":"x_sahih","state":"matches","level":1,"difference_ar":"موافق للمصدر. رُوي بالمعنى. جزءٌ من الحديث؛ تمامه في المصدر.","difference_en":"Matches the source. Quoted by meaning. A portion of the hadith; the whole is in the source.","source":{"site":"dorar.net","link":"https://dorar.net/h/kwlXLxcl","quote":"…إنَّ المُفلِسَ مِن أُمَّتي يَأتي يَومَ القيامةِ بصَلاةٍ، وصيامٍ، وزَكاةٍ، ويَأتي قد شَتَمَ هذا، وقَذَفَ هذا، وأكَلَ مالَ هذا، وسَفَك دَمَ هذا، وضَرَبَ هذا، فيُعطى هذا مِن حَسَناتِه، وهذا مِن حَسَناتِه…","collection":"صحيح مسلم","number":"2581","grader":"مسلم","grading":"[صحيح]","narrator":"أبو هريرة","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[{"source":"dorar.net","query":"إن المفلس من أمتي يأتي يوم القيامة","found":true}]}],"continues":null}}]},{"id":"7dd1d6a5-c1ee-449d-97e9-d4dea2a8743d","title":"شقى او سعيد","speaker":"الشيخ ياسر الدوسري","claims":[{"i":1,"kind":"hadith","timestamp":"00:02","timestamp_end":"00:28","quote":"أن الإنسان قد كتب هو شقي أو سعيد … بكتب رزقه","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":1,"line_ar":"حديث ابن مسعود في كتابة الرزق والشقاوة والسعادة، في صحيح مسلم","line_en":"Ibn Mas'ud's hadith that provision and being wretched or blessed are written, in Sahih Muslim 2643.","reason_ar":"الحديث في صحيح مسلم (2643) موصولًا، فهو صحيح؛ وهو في صحيح البخاري (3208) بلفظ قريب. ذكر المتحدث جزءًا منه بالمعنى.","reason_en":"A connected hadith of Sahih Muslim 2643, so sahih; also in Bukhari 3208 in a close wording (second card). Told in part and by meaning.","load_bearing":true,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"أن الإنسان قد كتب هو شقي أو سعيد … بكتب رزقه","text_ar":"في الحديث أن المَلَك يُؤمر بكتابة رزق الإنسان وأنه شقي أو سعيد","text_en":"The hadith says the angel is commanded to write a person's provision and whether he is wretched or blessed.","flow_kind":"hadith","exit_id":"x_sahih","state":"matches","level":1,"difference_ar":"موافق للمصدر. رُوي بالمعنى. جزءٌ من الحديث؛ تمامه في المصدر.","difference_en":"Matches the source. Quoted by meaning. A portion of the hadith; the whole is in the source.","source":{"site":"dorar.net","link":"https://dorar.net/h/PlSKZAGo","quote":"إنَّ أحَدَكُم يُجمَعُ خَلقُه في بَطنِ أُمِّه أربَعينَ يَومًا، … ثُمَّ يُرسَلُ المَلَكُ فيَنفُخُ فيه الرُّوحَ، ويُؤمَرُ بأربَعِ كَلِماتٍ: بكَتبِ رِزقِه ، وأجَلِه ، وعَمَلِه ، وشَقيٌّ ، أو سَعيدٌ …","collection":"صحيح مسلم","number":"2643","grader":"مسلم","grading":"[صحيح]","narrator":"عبدالله بن مسعود","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":"https://dorar.net/h/dgTSNGBS","gradings":null},"search_log":[{"source":"dorar.net","query":"بكتب رزقه وأجله وعمله وشقي أو سعيد","found":true},{"source":"dorar.net","query":"ويقال له اكتب عمله ورزقه","found":true}]}],"continues":null}},{"i":2,"kind":"saying","timestamp":"00:15","timestamp_end":"01:12","quote":"فقال الشيخ بن عثيمين لفتة جميلة جدا من هذا الحديث مع هذا الحديث، قال أنت أخذت جزءا من الحديث وتركت الجزء الآخر … طب لماذا لم تقل مثل هذا الكلام في الرزق؟ لماذا تخرج في كل صباح وتجتهد في البحث عن الرزق؟ وعندما يسألك أحد لماذا تبحث عن رزقك تقول أنا لابد أبذل السبب … الشيخ بن عثيمين يقول كما أنك مطالب بالاجتهاد بأخذ الأسباب لتحصيل الرزق فأنت أيضا مطالب بالأسباب التي توصلك إلى الهداية أن تتخذ كل السبل المتاحة لتصل إلى الهداية","old":null,"new":{"i":2,"flow_kind":"report","sub_kind":"saying","state":"matches","level":1,"line_ar":"قول ابن عثيمين: كما تسعى للرزق المكتوب فاسعَ لأسباب الهداية","line_en":"Ibn Uthaymin's saying: as you strive for written provision, strive for the means of guidance; in his treatise on qadar.","reason_ar":"وُجد المعنى في رسالة ابن عثيمين في القضاء والقدر، 1/16-17، بكلامه هو؛ ونقله المتحدث بالمعنى.","reason_en":"Found in Ibn Uthaymin's own Risala fi al-qada' wa'l-qadar, 1/16-17, in his words; the speaker retold it by meaning.","load_bearing":true,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"فقال الشيخ بن عثيمين لفتة جميلة جدا من هذا الحديث مع هذا الحديث، قال أنت أخذت جزءا من الحديث وتركت الجزء الآخر … طب لماذا لم تقل مثل هذا الكلام في الرزق؟ لماذا تخرج في كل صباح وتجتهد في البحث عن الرزق؟ وعندما يسألك أحد لماذا تبحث عن رزقك تقول أنا لابد أبذل السبب … الشيخ بن عثيمين يقول كما أنك مطالب بالاجتهاد بأخذ الأسباب لتحصيل الرزق فأنت أيضا مطالب بالأسباب التي توصلك إلى الهداية أن تتخذ كل السبل المتاحة لتصل إلى الهداية","text_ar":"قال ابن عثيمين: الرزق مكتوب كما أن العمل مكتوب، فكما تسعى في أسباب الرزق فاسعَ في أسباب الهداية","text_en":"Ibn Uthaymin said provision is written just as deeds are, so as one strives for provision one must strive for guidance.","flow_kind":"report","exit_id":"x_saying_own_work","state":"matches","level":1,"difference_ar":"في كتابه بلفظه","difference_en":"In his own work, in his words","source":{"site":"usul.ai","link":"https://usul.ai/t/a-treatise-on-predestination-and-fate/15?versionId=9Oh-dWgoTC","quote":"فهذا الرزق أيضا مكتوب كما أن العمل من صالح أو سيئ مكتوب فما بالك تذهب يمينا وشمالًا وتجوب الأرض والفيافي طلبًا لزرق الدنيا ولا تعمل عملا صالحا لطلب رزق الآخرة","collection":null,"number":null,"grader":null,"grading":null,"narrator":"محمد بن صالح العثيمين","work_ar":"رسالة في القضاء والقدر","ref_ar":"رسالة في القض com (verse_text supplied)","query":"29:69","found":true}]}],"continues":null}},{"i":4,"kind":"quran","timestamp":"01:23","timestamp_end":"01:26","quote":"أحسب الناس أن يتركوا أن يقولوا آمنا وهم لا يفتنون","old":null,"new":{"i":4,"flow_kind":"quran","sub_kind":null,"state":"matches","level":1,"line_ar":"الآية الثانية من سورة العنكبوت في ابتلاء من قال آمنا","line_en":"Al-Ankabut 29:2, that people saying 'we believe' will be tested, recited whole.","reason_ar":"الآية كاملة مطابقة لنص المصحف في العنكبوت 2.","reason_en":"The whole verse matches the mushaf text of 29:2 word for word.","load_bearing":false,"parts":[{"position":1,"kind":"verse","origin":"spoken","said_text":"أحسب الناس أن يتركوا أن يقولوا آمنا وهم لا يفتنون","text_ar":"قال الله تعالى: أحسب الناس أن يتركوا أن يقولوا آمنا وهم لا يفتنون","text_en":"Allah says: do people think they will be left to say 'we believe' and not be tested?","flow_kind":"quran","exit_id":"x_exact","state":"matches","level":1,"difference_ar":"مطابق لنص المصحف.","difference_en":"Matches the mushaf text.","source":{"site":"quran.com","link":"https://quran.com/29/2","quote":"أَحَسِبَ النَّاسُ أَن يُتْرَكُوا أَن يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":null,"ref_ar":"العنكبوت 2","volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[{"source":"quran.com (verse_text supplied)","query":"29:2","found":true}]}],"continues":null}}]},{"id":"9a125bb2-936e-4f66-acdf-0f6e86dbf814","title":"واخفظ لهما جناح الذل","speaker":"فداء الدين يحيى","claims":[{"i":1,"kind":"quran","timestamp":"00:00","timestamp_end":"00:03","quote":"واخفض لهما جناح الذل","old":null,"new":{"i":1,"flow_kind":"quran","sub_kind":null,"state":"matches","level":1,"line_ar":"تلاوة مطلع الآية ٢٤ من سورة الإسراء في خفض الجناح للوالدين","line_en":"Recitation of the opening words of al-Isra 17:24 on lowering the wing of humility to parents.","reason_ar":"الكلمات مط "position":1,"kind":"ruling","origin":"spoken","said_text":"مسألة إنه والله تحترمني أحترمك، ترفع صوتك علي أرفع صوتي عليك، هذه لا مكان لها في علاقتك بوالديك","text_ar":"لا يجوز للولد أن يقابل والديه بالمثل فيرفع صوته عليهما إن رفعا صوتهما عليه؛ فليست علاقته بهما علاقة أنداد.","text_en":"A child may not answer his parents in kind, raising his voice at them when they raise theirs; the relationship is not one between equals.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"الموسوعة الكويتية تعدّ ما يبديه الولد لأبويه من غضب واستطالة عليهما من العقوق، وتذكر أنه أُمر أن يقابلهما بالحسنى واللين؛ وحكى ابن حزم الاتفاق بلفظه: «واتفقوا أن بر الوالدين فرض».","difference_en":"The Kuwaiti Encyclopaedia counts a child's anger and overbearing toward his parents as uqooq and says he is commanded to meet them with gentleness; Ibn Hazm records the agreement in his words: «they agreed that birr to parents is obligatory».","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/2570?versionId=MT3i8pDNoM","quote":"وَمِنَ الْعُقُوقِ مَا يُبْدِيهِ الْوَلَدُ لأَِبَوَيْهِ مِنْ مَلَلٍ وَضَجَرٍ وَغَضَبٍ وَانْتِفَاخِ أَوْدَاجِهِ، وَاسْتِطَالَتِهِ عَلَيْهِمَا بِدَالَّةِ الْبُنُوَّةِ … وَقَدْ أُمِرَ أَنْ يُقَابِلَهُمَا بِالْحُسْنَى وَاللِّينِ وَالْمَوَدَّةِ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ٨/٧٢، مصطلح بر الوالدين: عقوق الوالدين وجزاؤه؛ ومعه مراتب الإجماع لابن حزم ١/١٥٧","volume":"8","page":72,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/2570?versionId=MT3i8pDNoM","confirm_url":"https://usul.ai/t/maratib-ijmac/151?versionId=npfU3g5dFu","gradings":null},"search_log":[{"source":"continuation.mjs","query":"claim 2 vs open text of 17:24","found":false},{"source":"usul:kuwaiti (toc)","query":"بر الوالدين","found":true},{"source":"usul:kuwaiti (find)","query":"رفع الصوت على الوالدين","found":false},{"source":"usul:kuwaiti (page)","query":"pages 2558-2562 (بر الوالدين: التعريف، حكمه التكليفي)","found":true},{"source":"usul:kuwaiti (find)","query":"يرفع صوته على","found":false},{"source":"usul:kuwaiti (find)","query":"ولا يرفع صوته","found":false},{"source":"usul:kuwaiti (toc)","query":"عقوق","found":true},{"source":"usul:kuwaiti (page)","query":"page 2569 vol 8 p.72 عقوق الوالدين وجزاؤه","found":true},{"source":"usul:kuwaiti (find)","query":"عقوق الوالدين من الكبائر","found":true},{"source":"usul:kuwaiti (find)","query":"اتفقوا أن بر الوالدين فرض","found":false},{"source":"usul:kuwaiti (find)","query":"أجمع العلماء بر الوالدين","found":false},{"source":"shamela:kuwaiti","query":"اتفقوا على أن بر الوالدين فرض","found":false},{"source":"shamela:al-majmu","query":"عقوق الوالدين حرام","found":false},{"source":"shamela:kuwaiti","query":"بر الوالدين فرض عين","found":false},{"source":"shamela:al-mughni","query":"بر الوالدين فرض","found":false},{"source":"shamela:kuwaiti (retry)","query":"وبر الوالدين فرض عين","found":false},{"source":"shamela:kuwaiti (retry)","query":"واستطالته عليهما بدالة البنوة (phrase known to be on the page: Shamela unresponsive)","found":false},{"source":"usul.ai search","query":"مراتب الإجماع","found":true},{"source":"usul:maratib-ijmac (find)","query":"بر الوالدين فرض","found":true}]}]}},{"i":3,"kind":"other","timestamp":"00:24","timestamp_end":"00:52","quote":"مفاهيم التربية الحديثة المستوردة من المجتمع الغربي فيها أفكار جميلة ومبرهنة علمياً، لكنها أيضاً تحوي أخطاء فادحة، منها التحريض على الوالدين، شحن الأبناء بفكرة أن العلاقة بين الأبناء والوالدين قائمة على المساواة المطلقة. هذه المفاهيم نشأت في بيئة متخلفة عن هدي القرآن في تعظيم حق الوالدين، ولم تستطع أن ترقى إلى المعدن الأخلاقي القرآني.","old":null,"new":{"i":3,"flow_kind":"no_origin","sub_kind":null,"state":"not_a_claim","level":0,"line_ar":"رأي المتحدث في نظريات التربية الغربية الحديثة ومساواتها المطلقة بين الأبناء والوالدين","line_en":"The speaker's own critique of imported Western parenting theories and their absolute parent-child equality.","reason_ar":"رأي في نظريات تربوية معاصرة لا يدّعي حكمًا شرعيًا ولا ينسب إلى مصدر نصًّا يُفحص.","reason_en":"An opinion on modern parenting theories that claims no ruling and cites no checkable source.","load_bearing":false,"continues":null,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"مفاهيم التربية الحديثة المستوردة من المجتمع الغربي فيها أفكار جميلة ومبرهنة علمياً، لكنها أيضاً تحوي أخطاء فادحة، منها التحريض على الوالدين، شحن الأبناء بفكرة أن العلاقة بين الأبناء والوالدين قائمة على المساواة المطلقة.","text_ar":"رأي المتحدث أن مفاهيم التربية الغربية الحديثة فيها أخطاء، منها تقرير المساواة المطلقة بين الأبناء والوالدين.","text_en":"The speaker's view that modern Western parenting concepts contain errors, among them absolute equality between children and parents.","flow_kind":"no_origin","exit_id":"x_own_view","state":"not_a_claim","level":0,"difference_ar":null,"difference_en":null,"source":{"site":null,"link":null,"quote":null,"collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[{"source":"continuation.mjs","query":"claim 3 vs open Kuwaiti page 8/72 text","found":false}]}]}}]},{"id":"3d84e19f-b3a9-4319-b997-0ffede36c76d","title":"الخلوات؟","speaker":"الشيخ ياسر الدوسري","claims":[{"i":1,"kind":"saying","timestamp":"00:00","timestamp_end":"00:12","quote":"وإذا خلوت بريبة في ظلمة والنفس داعية إلى العصيان فاستحي من نظر الإله وقل لها إن الذي خلق الظلام يراني","old":null,"new":{"i":1,"flow_kind":"report","sub_kind":"saying","state":"not_found","level":0,"line_ar":"بيتان من الشعر في مراقبة الله في الخلوة، دون نسبة لقائل","line_en":"Two unattributed lines of poetry on feeling shy before Allah's sight when alone in darkness.","reason_ar":"لم نجد البيتين في المصادر المعتمدة: الكتب التسعة الموثّقة وكتب الشاملة الأربعة، ولا في تفسير الرازي الذي بحثنا فيه تتبّعًا لأثرهما؛ والمتحدث لم ينسبهما لأحد.","reason_en":"The lines were not found in the cleared sources (the nine verified copies and Shamela's four books), nor in al-Razi's tafsir, which was searched as a lead. The speaker named no poet.","load_bearing":true,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"وإذا خلوت بريبة في ظلمة والنفس داعية إلى العصيان فاستحي من نظر الإله وقل لها إن الذي خلق الظلام يراني","text_ar":"بيتان من الشعر: إذا خلوتَ بريبةٍ في ظلمة ودعتك نفسك إلى المعصية فاستحِ من نظر الله، فإن الذي خلق الظلام يراك.","text_en":"Two lines of verse: when alone in darkness and the self urges sin, feel shy before Allah's sight, for the One who created darkness sees you.","flow_kind":"report","exit_id":"x_notfound","state":"not_found","level":0,"difference_ar":"لم يوجد · بحثنا في الكتب التسعة الموثّقة (تفسير الطبري، تفسير البغوي، تاريخ الطبري، سيرة ابن هشام، زاد المعاد، المغني، المجموع، الموسوعة الكويتية، الأشباه والنظائر) والشاملة وتفسير الرازي","difference_en":"Not found · searched in the nine verified copies (al-Tabari's tafsir and history, al-Baghawi, Ibn Hisham, Zad al-Ma'ad, al-Mughni, al-Majmu', the Kuwaiti encyclopaedia, al-Ashbah), Shamela and al-Razi's tafsir","source":{"site":null,"link":null,"quote":null,"collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[{"source":"usul.ai kuwaiti-encyclopedia-of-jurisprudence (chapter: toc)","query":"مراقبة → «مراقبة الله تعالى», vol 36 p.337, apiIndex 12504, read: does not quote the lines","found":false},{"source":"usul.ai kuwaiti-encyclopedia-of-jurisprudence (chapter: toc)","query":"حياء","found":false},{"source":"usul.ai tafsir-al-baghawi","query":"خلق الظلام يراني","found":false},{"source":"usul.ai tafsir-al-tabari-jami-al-bayan","query":"خلق الظلام يراني","found":false},{"source":"usul.ai kuwaiti-encyclopedia-of-jurisprudence","query": و استأثرت به في علم الغيب عندك أن تجعل القرآن ربيع قلبي ونور صدري وذهاب غمي وهمي إلا أذهب الله غمه وهمه وأبدله بهما فرحا … فقالوا يا رسول الله أفلا نتعلمهن قال بلى ينبغي لمن يسمعهن أن يتعلمهن","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":4,"line_ar":"حديث ابن مسعود في دعاء الهم والحزن، صحّحه الألباني وضعّف شعيب إسناده في المسند","line_en":"Ibn Mas'ud's hadith of the distress supplication: al-Albani graded it sahih, Shu'ayb weakened the Musnad chain.","reason_ar":"صحّحه الألباني في السلسلة الصحيحة (199)، وقال شعيب الأرناؤوط: «إسناده ضعيف» في تخريج المسند (3712)، و«إسناده صحيح» في تخريج ابن حبان (972)؛ فلمّا اختلف المحدّثون أُخذ بالأضعف بحسب قاعدة المسار، مع عرض الحكمين.","reason_en":"Al-Albani graded it sahih (al-Silsila al-Sahiha 199). Shu'ayb al-Arna'ut graded the chain weak in his Musnad edition (3712) and sound in his Ibn Hibban edition (972). The graders differ, so the flow's rule ranks it at the weaker grade and shows both.","load_bearing":true,"continues":null,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"عن النبي صلى الله عليه وسلم قال ما أصاب عبد قط هم ولا حزن فقال اللهم إني عبدك وابن عبدك وابن أمتك ناصيتي بيدك ماض في حكمك عدل في قضاؤك أسألك بكل اسم هو لك سميت به نفسك أو علمته أحداً من خلقك أو استأثرت به في علم الغيب عندك أن تجعل القرآن ربيع قلبي ونور صدري وذهاب غمي وهمي إلا أذهب الله غمه وهمه وأبدله بهما فرحا","text_ar":"قال النبي ﷺ: من أصابه همٌّ أو حزنٌ فقال: «اللهم إني عبدك...» إلى آخر الدعاء، أذهب الله همّه وأبدله مكانه فرحًا.","text_en":"The Prophet ﷺ said that whoever is struck by worry or grief and says this supplication ('O Allah, I am Your servant...'), Allah will remove his worry and replace it with joy.","flow_kind":"hadith","exit_id":"x_daif_as_accepted","state":"matches","level":4,"difference_ar":"موافق للمصدر؛ وحكم شعيب الأرناؤوط على إسناده في المسند: «إسناده ضعيف»، وصحّحه الألباني. الضعف حكمٌ على طريق النقل، لا حكمٌ بأن المعنى كذب؛ والعمل به في «كيف نتلقّاه». رُوي بالمعنى، وسقط منه «أو أنزلته في كتابك» و«وجلاء حزني».","difference_en":"Matches the source. Shu'ayb al-Arna'ut graded its Musnad chain «إسناده ضعيف»; al-Albani graded it «صحيح». Weakness is a judgment on the chain, not a judgment that the meaning is false; acting on it is in «How to receive it». Quoted by meaning; the phrases «or revealed in Your Book» and «the removal of my grief» are left out.","source":{"site":"dorar.net","link":"https://dorar.net/h/2cmaZ8GL","quote":"ما أصاب أحدًا قط همٌّ و لا حزنٌ ، فقال : اللهمَّ إني عبدُك، و ابنُ عبدِك، و ابنُ أَمَتِك، ناصيتي بيدِك، ماضٍ فيَّ حكمُك، عدلٌ فيَّ قضاؤُك، أسألُك بكلِّ اسمٍ هو لك سميتَ به نفسَك، أو علَّمتَه أحدًا من خلقِك، أو أنزلتَه في كتابِك، أو استأثرتَ به في علمِ الغيبِ عندَك، أن تجعلَ القرآنَ ربيعَ قلبي ، و نورَ صدري، و جلاءَ حزني ، و ذَهابَ همِّي ، إلا أذهبَ اللهُ همَّهُ و حزنَه ، و أبدلَه مكانَه فرجًا …","collection":"السلسلة الصحيحة","number":"199","grader":"الألباني","grading":"صحيح","narrator":"عبدالله بن مسعود","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":"https://dorar.net/h/ZumVhevx","gradings":[{"grader":"شعيب الأرناؤوط","grading":"إسناده ضعيف","link":"https://dorar.net/h/1GcvRrtv","collection":"تخريج المسند لشعيب","number":"3712"},{"grader":"شعيب الأرناؤوط","grading":"إسناده صحيح، رجاله رجال الصحيح","link":"https://dorar.net/h/PR9XdzJR","collection":"تخريج صحيح ابن حبان","number":"972"}]},"search_log":[{"source":"dorar.net","query":"ما أصاب أحدا قط هم ولا حزن","found":true}]},{"position":2,"kind":"hadith","origin":"spoken","said_text":"فقالوا يا رسول الله أفلا نتعلمهن قال بلى ينبغي لمن يسمعهن أن يتعلمهن","text_ar":"سأل الصحابة: أفلا نتعلّم هذه الكلمات؟ فقال ﷺ: بلى، ينبغي لمن سمعها أن يتعلّمها.","text_en":"The Companions asked whether they should learn these words, and the Prophet ﷺ said yes, whoever hears them should learn them.","flow_kind":"hadith","exit_id":"x_daif_as_accepted","state":"matches","level":4,"difference_ar":"موافق للمصدر؛ وحكم شعيب الأرناؤوط على إسناده في ا eaker gives it by meaning, with the halves swapped and in the third person.","load_bearing":false,"parts":[{"position":1,"kind":"saying","origin":"spoken","said_text":"ومن وجد الله فماذا فقد؟ ومن فقد الله فماذا وجد؟","text_ar":"من وجد الله لم يفقد شيئًا، ومن فقد الله لم يجد شيئًا.","text_en":"Whoever finds Allah has lost nothing, and whoever loses Allah has found nothing.","flow_kind":"report","exit_id":"x_saying_own_work","state":"matches","level":1,"difference_ar":"في كتابه بلفظه","difference_en":"In his own work, in his words","source":{"site":"usul.ai","link":"https://usul.ai/t/al-hikam-al-ataiyya/9?versionId=I0rAzTA3UZ","quote":"ماذا وجد من فقدك وما الذي فقد من وجدك","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الحكم العطائية لابن عطاء الله السكندري (ط دار الإيمان، دمشق، 1406هـ)","ref_ar":"الحكم العطائية، ج1 ص290","volume":"1","page":290,"page_url":"https://usul.ai/t/al-hikam-al-ataiyya/9?versionId=I0rAzTA3UZ","confirm_url":null,"gradings":null},"search_log":[{"source":"usul:zad-al-maad-fi-hady-khayr-al-ibad","query":"ماذا وجد من فقدك","found":false},{"source":"usul:tafsir-al-baghawi","query":"ماذا وجد من فقدك","found":false},{"source":"usul:tafsir-al-tabari-jami-al-bayan","query":"ماذا وجد من فقدك","found":false},{"source":"usul:kuwaiti-encyclopedia-of-jurisprudence","query":"ماذا وجد من فقدك","found":false},{"source":"usul:zad-al-maad-fi-hady-khayr-al-ibad","query":"وجد الله فماذا فقد (a word match only: vol 2 p.482 does not carry the saying)","found":false},{"source":"usul:kuwaiti-encyclopedia-of-jurisprudence","query":"وجد الله فماذا فقد","found":false},{"source":"usul.ai (book search)","query":"الحكم العطائية","found":true},{"source":"usul:al-hikam-al-ataiyya (versionId I0rAzTA3UZ), pages 0-8 read","query":"فقدك","found":true}],"outside_nine":"الحكم العطائية لابن عطاء الله السكندري (ط دار الإيمان، دمشق، 1406هـ)"}],"continues":null}}]},{"id":"29c6cd88-6947-46fc-b6fb-a7b134021a21","title":"ارحم نفسك","speaker":"د. عبدالرحمن ذاكر الهامشي","claims":[{"i":1,"kind":"hadith","timestamp":"00:04","timestamp_end":"00:14","quote":"لا يحل لمسلم أن يذل نفسه. قالوا وكيف يذلها يا رسول الله؟ قال يكلفها من البلاء ما لا تطيق","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":2,"line_ar":"حديث حذيفة: لا ينبغي للمؤمن أن يذل نفسه، في سنن الترمذي","line_en":"Hadith of Hudhayfa that a believer should not humiliate himself, in al-Tirmidhi 2254, told by meaning.","reason_ar":"صحّحه الألباني في صحيح الترمذي وحسّنه في صحيح ابن ماجه، وحسّنه ابن حجر؛ فرُتّب على الأدنى: حسن.","reason_en":"Al-Albani graded it sahih (Sahih al-Tirmidhi) and hasan (Sahih Ibn Majah); Ibn Hajar hasan; ranked at the weaker: hasan.","load_bearing":true,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"لا يحل لمسلم أن يذل نفسه. قالوا وكيف يذلها يا رسول الله؟ قال يكلفها من البلاء ما لا تطيق","text_ar":"قال النبي ﷺ: لا ينبغي للمؤمن أن يذل نفسه، وفسّره بأن يتعرض من البلاء لما لا يطيق.","text_en":"The Prophet said a believer should not humiliate himself, explained as exposing himself to trials he cannot bear.","flow_kind":"hadith","exit_id":"x_hasan","state":"matches","level":2,"difference_ar":"موافق للمصدر. رُوي بالمعنى: لفظ المصدر «لا ينبغي للمؤمن… يتعرض من البلاء لما لا يطيق».","difference_en":"Matches the source. Quoted by meaning: the source's wording is «لا ينبغي للمؤمن… يتعرض من البلاء لما لا يطيق» (it is not fitting for a believer… exposes himself to trials he cannot bear).","source":{"site":"dorar.net","link":"https://dorar.net/h/aFYkn7MY","quote":"لا يَنبغي للمُؤمنِ أن يُذلَّ نفسَه قالوا : وكيف يُذلُّ نفسَه ؟ قال : يتعرَّضُ مِن البلاءِ لما لا يُطيقُ","collection":"صحيح الترمذي","number":"2254","grader":"الألباني","grading":"صحيح","narrator":"حذيفة بن اليمان","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":"https://dorar.net/h/WzVd9iCy","gradings":[{"grader":"ابن حجر العسقلاني","grading":"حسن","link":"https://dorar.net/h/REnareCQ"," "00:02","quote":"كم أركان الإسلام؟ خمسة","old":null,"new":{"i":1,"flow_kind":"number","sub_kind":null,"state":"matches","level":1,"line_ar":"عدد أركان الإسلام خمسة، كما في حديث «بني الإسلام على خمس» في الصحيحين","line_en":"The pillars of Islam are five: the figure in the hadith 'Islam is built on five' (Bukhari 8, Muslim 16).","reason_ar":"العدد في حديث ابن عمر في صحيح البخاري (8) وصحيح مسلم (16)، وما فيهما صحيح","reason_en":"The figure is in Ibn Umar's hadith in Sahih al-Bukhari 8 and Sahih Muslim 16, sahih by definition.","load_bearing":true,"parts":[{"position":1,"kind":"figure","origin":"spoken","said_text":"كم أركان الإسلام؟ خمسة","text_ar":"أركان الإسلام خمسة","text_en":"The pillars of Islam are five.","flow_kind":"number","exit_id":"x_in_text","state":"matches","level":1,"difference_ar":"كما ورد في النصّ","difference_en":"As the text has it","source":{"site":"dorar.net","link":"https://dorar.net/h/JDqeTpYd","quote":"بُنيَ الإسلامُ على خَمسٍ : شَهادةِ أن لا إلَهَ إلَّا اللهُ وأنَّ مُحَمَّدًا رَسولُ اللهِ، وإقامِ الصَّلاةِ، وإيتاءِ الزَّكاةِ، والحَجِّ، وصَومِ رَمَضانَ.","collection":"صحيح البخاري","number":"8","grader":"البخاري","grading":"[صحيح]","narrator":"عبدالله بن عمر","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":"https://dorar.net/h/TCubdkk0","gradings":null},"search_log":[{"source":"dorar.net","query":"بني الإسلام على خمس","found":true}]}],"continues":null}},{"i":2,"kind":"ruling","timestamp":"00:07","timestamp_end":"00:11","quote":"باقي الزكاة. لو كان فقير يزكي؟ ما يقدر... ما عليه زكاة","old":null,"new":{"i":2,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"لا زكاة على من لا يملك نصابًا؛ حكم متفق عليه في الموسوعة الكويتية","line_en":"No zakat on a poor person who cannot pay: a ruling the jurists agree on (Kuwaiti encyclopaedia 23/231-232).","reason_ar":"الموسوعة الكويتية تحكي اتفاق الفقهاء على أن الزكاة تجب إذا بلغ المال نصابًا وكان قادرًا على أدائها","reason_en":"The Kuwaiti encyclopaedia reports that the jurists agree zakat is due only when wealth reaches the nisab and the owner can pay it.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"باقي الزكاة. لو كان فقير يزكي؟ ما يقدر... ما عليه زكاة","text_ar":"الفقير الذي لا يقدر على الزكاة لا تجب عليه","text_en":"A poor person who cannot pay zakat does not owe it.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «اتفق الفقهاء على أن البالغ العاقل المسلم… تجب في ماله الزكاة إذا بلغ نصابًا، وكان متمكنًا من أداء الزكاة»؛ والشرط في المصدر بلوغ النصاب والقدرة على الأداء.","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «the jurists agreed that the adult sane Muslim… owes zakat on his wealth when it reaches the nisab and he is able to pay it»; the source's condition is reaching the nisab and being able to pay.","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/7614?versionId=MT3i8pDNoM","quote":"تَجِبُ فِي مَالِهِ الزَّكَاةُ إِذَا بَلَغَ نِصَابًا، وَكَانَ مُتَمَكِّنًا مِنْ أَدَاءِ الزَّكَاةِ، وَتَمَّتِ الشُّرُوطُ فِي الْمَال.","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ٢٣ / ٢٣٢ (يبدأ الكلام في ٢٣ / ٢٣١: «اتفق الفقهاء على أن البالغ العاقل المسلم»)","volume":"23","page":232,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/7614?versionId=MT3i8pDNoM","confirm_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/7613?versionId=MT3i8pDNoM","gradings":null},"search_log":[{"source":"usul.ai kuwaiti toc","query":"شروط وجوب الزكاة","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 7617 (شروط المال الذي تجب فيه الزكاة، 23/236)","found":true},{"source":"usul.ai kuwaiti find","query":"لا زكاة فيما دون النصاب","found":true},{"source":"usul.ai kuwaiti find","query":"لا تجب الزكاة على الفقير","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 7612-7613 (من تجب في ماله الزكاة، 23/231-232)","found":true}]}],"continues":null}},{"i":3,"kind":"ruling","timestamp":"00:12","timestamp_end":"00:15","quote":"طيب بما أنه فقير ما يقدر يحج؟ شيل الحج","old":null,"new":{"i":3,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"لا يجب الحج على غير المستطيع؛ قال ابن قدامة في المغني: لا نعلم فيه اختلافًا","line_en":"Hajj is not obligatory on one unable to afford it; al-Mughni 3/213 records no known difference.","reason_ar":"ابن قدامة يجعل الاستطاعة شرطًا لوجوب الحج ويقول: «لا نعلم في هذا كله اختلافًا»","reason_en":"Ibn Qudama lists capability as a condition of Hajj being obligatory and writes that he knows of no difference on it.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"طيب بما أنه فقير ما يقدر يحج؟ شيل الحج","text_ar":"الفقير غير المستطيع لا يجب عليه الحج","text_en":"Hajj is not obligatory on a poor person who cannot afford it.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «لا نعلم في هذا كله اختلافًا»، ويذكر أيضًا: «أجمعت الأمة على وجوب الحج على المستطيع».","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «we know of no difference in any of this»; it also says «the community agreed that Hajj is obligatory on the one who is able».","source":{"site":"usul.ai","link":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/1172?versionId=5HK0y3GSR2","quote":"وَجُمْلَةُ ذَلِكَ أَنَّ الْحَجَّ إنَّمَا يَجِبُ بِخَمْسِ شَرَائِطَ: الْإِسْلَامُ، وَالْعَقْلُ، وَالْبُلُوغُ، وَالْحُرِّيَّةُ، وَالِاسْتِطَاعَةُ. لَا نَعْلَمُ فِي هَذَا كُلِّهِ اخْتِلَافًا.","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"المغني لابن قدامة","ref_ar":"المغني لابن قدامة ٣ / ٢١٣","volume":"3","page":213,"page_url":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/1172?versionId=5HK0y3GSR2","confirm_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/5419?versionId=MT3i8pDNoM","gradings":null},"search_log":[{"source":"usul.ai kuwaiti toc","query":"الاستطاعة","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 5418-5419 (الشرط الخامس: الاستطاعة، 17/28-29)","found":true},{"source":"usul.ai al-mughni find","query":"إنما يجب بخمس شرائط","found":true}]}],"continues":null}},{"i":4,"kind":"ruling","timestamp":"00:16","timestamp_end":"00:18","quote":"وقد يكون مريض فما يقدر يصوم، شيل الصيام","old":null,"new":{"i":4,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"يباح الفطر للمريض العاجز عن الصوم؛ إجماع ينقله ابن قدامة في الموسوعة الكويتية","line_en":"A sick person unable to fast may break the fast: consensus relayed from Ibn Qudama in the Kuwaiti encyclopaedia 28/45.","reason_ar":"الموسوعة الكويتية تنقل عن ابن قدامة: «أجمع أهل العلم على إباحة الفطر للمريض في الجملة»","reason_en":"The Kuwaiti encyclopaedia relays from Ibn Qudama that the scholars agree, in general, that a sick person may break the fast.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"وقد يكون مريض فما يقدر يصوم، شيل الصيام","text_ar":"المريض العاجز عن الصوم يسقط عنه الصوم","text_en":"The fast is lifted from a sick person who cannot fast.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «أجمع أهل العلم على إباحة الفطر للمريض في الجملة»، ويستدل بقوله تعالى: ﴿فعدة من أيام أخر﴾ (أي يقضي ما أفطر).","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «the scholars agree, in general, that the sick may break the fast»; its evidence is the verse «then a number of other days», which means the missed days are made up later.","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9299?versionId=MT3i8pDNoM","quote":"قَال ابْنُ قُدَامَةَ: أَجْمَعَ أَهْل الْعِلْمِ عَلَى إِبَاحَةِ الْفِطْرِ لِلْمَرِيضِ فِي الْجُمْلَةِ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ٢٨ / ٤٥","volume":"28","page":45,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9299?versionId=MT3i8pDNoM","confirm_url":null,"gradings":null},"search_log":[{"source":"usul.ai kuwaiti toc","query":"المرض","found":true},{"source":"usul.ai kuwaiti find","query":"أجمع العلماء على إباحة الفطر للمريض","found":false},{"source":"usul.ai kuwaiti find","query":"الفطر للمريض","found":true}]}],"continues":null}},{"i":5,"kind":"ruling","timestamp":"00:27","timestamp_end":"00:30","quote":"تسقط عني الصلاة إذا كنت مسافر؟ غير صحيح","old":null,"new":{"i":5,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"الصلاة لا تسقط بالسفر بل تُقصر؛ إجماع في المغني لابن قدامة","line_en":"Prayer is not dropped in travel but shortened: consensus recorded in al-Mughni 2/188.","reason_ar":"ابن قدامة ينقل إجماع أهل العلم على أن المسافر يقصر الرباعية فيصليها ركعتين","reason_en":"Ibn Qudama records the scholars' consensus that the traveller shortens a four-unit prayer to two, so he still prays it.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"تسقط عني الصلاة إذا كنت مسافر؟ غير صحيح","text_ar":"الصلاة لا تسقط عن المسافر","text_en":"Prayer is not dropped for a traveller.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «أجمع أهل العلم على أن من سافر سفرًا تقصر في مثله الصلاة… أن له أن يقصر الرباعية فيصليها ركعتين»؛ أي يصليها مقصورة ولا تسقط.","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «the scholars agree that whoever travels a journey in which prayer is shortened… may shorten the four-unit prayer and pray it as two»; so it is shortened, not dropped.","source":{"site":"usul.ai","link":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/636?versionId=5HK0y3GSR2","quote":"وَأَجْمَعَ أَهْلُ الْعِلْمِ عَلَى أَنَّ مَنْ سَافَرَ سَفَرًا تَقْصُرُ فِي مِثْلِهِ الصَّلَاةُ فِي حَجٍّ، أَوْ عُمْرَةٍ، أَوْ جِهَادٍ، أَنَّ لَهُ أَنْ يَقْصُرَ الرَّبَاعِيَّةَ فَيُصَلِّيَهَا رَكْعَتَيْنِ.","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"المغني لابن قدامة","ref_ar":"المغني لابن قدامة ٢ / ١٨٨","volume":"2","page":188,"page_url":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/636?versionId=5HK0y3GSR2","confirm_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9144?versionId=MT3i8pDNoM","gradings":null},"search_log":[{"source":"usul.ai kuwaiti find","query":"لا تسقط الصلاة عن","found":false},{"source":"usul.ai kuwaiti toc","query":"صلاة المسافر","found":true},{"source":"usul.ai kuwaiti toc","query":"قصر الصلاة","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 9143 (صلاة المسافر، 27/266)","found":true},{"source":"usul.ai al-mughni find","query":"أجمع أهل العلم على أن من سافر","found":true}]}],"continues":null}},{"i":6,"kind":"ruling","timestamp":"00:34","timestamp_end":"00:36","quote":"طيب لو ما وجدت ماء تسقط؟ تتيمم","old":null,"new":{"i":6,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"من فقد الماء تيمّم ولا تسقط عنه الصلاة؛ إجماع في الموسوعة الكويتية","line_en":"Without water one performs tayammum and still prays: consensus in the Kuwaiti encyclopaedia 14/248-249.","reason_ar":"الموسوعة الكويتية: «أجمع المسلمون على أن التيمم مشروع بدلًا عن الوضوء والغسل»، مع آية ﴿فلم تجدوا ماء فتيمموا﴾","reason_en":"The Kuwaiti encyclopaedia records Muslim consensus that tayammum replaces wudu and ghusl, with the verse on not finding water.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"طيب لو ما وجدت ماء تسقط؟ تتيمم","text_ar":"من لم يجد الماء لا تسقط عنه الصلاة بل يتيمم ويصلي","text_en":"One who finds no water is not excused from prayer: he performs tayammum and prays.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «أجمع المسلمون على أن التيمم مشروع بدلًا عن الوضوء والغسل في أحوال خاصة».","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «the Muslims agree that tayammum is prescribed in place of wudu and ghusl in particular circumstances».","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/4688?versionId=MT3i8pDNoM","quote":"وَقَدْ أَجْمَعَ الْمُسْلِمُونَ عَلَى أَنَّ التَّيَمُّمَ مَشْرُوعٌ بَدَلًا عَنِ الْوُضُوءِ وَالْغُسْل فِي أَحْوَالٍ خَاصَّةٍ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ١٤ / ٢٤٩","volume":"14","page":249,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/4688?versionId=MT3i8pDNoM","confirm_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/4687?versionId=MT3i8pDNoM","gradings":null},"search_log":[{"source":"usul.ai kuwaiti toc","query":"التيمم","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 4686 (مشروعية التيمم، 14/248)","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 4687 (14/249)","found":true}]}],"continues":null}},{"i":7,"kind":"ruling","timestamp":"00:37","timestamp_end":"00:43","quote":"طيب لو مش قادر أوقف أصلي تسقط؟ تصلي وأنت قاعد. طيب لو ما أقدر أقعد تسقط عني الصلاة؟ تصلي وأنت منسدح","old":null,"new":{"i":7,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":1,"line_ar":"العاجز عن القيام يصلي قاعدًا ثم مضطجعًا؛ الأول إجماع والثاني قول الجمهور في الموسوعة الكويتية","line_en":"One unable to stand prays sitting, then lying down: sitting by consensus, lying the majority's way (Kuwaiti encyclopaedia).","reason_ar":"الموسوعة الكويتية تحكي إجماع الفقهاء على صلاة العاجز عن القيام جالسًا، وتنسب صلاة العاجز عن القعود على جنبه إلى الجمهور، والحنفية على أن يستلقي على قفاه","reason_en":"The Kuwaiti encyclopaedia records consensus on sitting; praying on the side when unable to sit is the majority's view, the Hanafis say on the back.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"طيب لو مش قادر أوقف أصلي تسقط؟ تصلي وأنت قاعد","text_ar":"العاجز عن القيام يصلي قاعدًا ولا تسقط عنه الصلاة","text_en":"One unable to stand prays sitting; the prayer is not dropped.","flow_kind":"ruling","exit_id":"x_ijma","state":"matches","level":1,"difference_ar":"المصدر يذكر اتفاق العلماء على هذا الحكم بلفظه: «أجمع الفقهاء على أن من لا يطيق القيام له أن يصلي جالسًا».","difference_en":"The source records the scholars' agreement on this ruling, in its own words: «the jurists agree that one who cannot stand may pray sitting».","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9137?versionId=MT3i8pDNoM","quote":"وَقَدْ أَجْمَعَ الْفُقَهَاءُ عَلَى أَنَّ مَنْ لاَ يُطِيقُ الْقِيَامَ لَهُ أَنْ يُصَلِّيَ جَالِسًا","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ٢٧ / ٢٥٩","volume":"27","page":259,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9137?versionId=MT3i8pDNoM","confirm_url":"https://usul.ai/t/al-mughni-sharh-mukhtasar-al-khiraqi/554?versionId=5HK0y3GSR2","gradings":null},"search_log":[{"source":"usul.ai kuwaiti toc","query":"صلاة المريض","found":true},{"source":"usul.ai al-mughni find","query":"أجمع أهل العلم على أن من لا يطيق القيام","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 9136 (صلاة المريض، 27/259)","found":true}]},{"position":2,"kind":"ruling","origin":"spoken","said_text":"طيب لو ما أقدر أقعد تسقط عني الصلاة؟ تصلي وأنت منسدح","text_ar":"العاجز عن القعود يصلي مضطجعًا ولا تسقط عنه الصلاة","text_en":"One unable to sit prays lying down; the prayer is not dropped.","flow_kind":"ruling","exit_id":"x_jumhur","state":"matches","level":2,"difference_ar":"المصدر ينسب هذا الحكم إلى الجمهور (أكثر الفقهاء) ويسمّي من خالف: الحنفية، وعندهم يستلقي على قفاه، وهو اضطجاع أيضًا، والجمهور على جنبه؛ وقد قيل بلا إشارة إلى الخلاف.","difference_en":"The source attributes this ruling to the majority of jurists and names who differs: the Hanafis, who have him lie on his back (also lying down) where the majority say on his side; it was stated with no mention of the difference.","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9872?versionId=MT3i8pDNoM","quote":"ذَهَبَ الْجُمْهُورُ إِلَى أَنَّ مَنْ عَجَزَ عَنِ الْقُعُودِ صَلَّى عَلَى جَنْبِهِ مُسْتَقْبِلًا الْقِبْلَةَ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"الموسوعة الفقهية الكويتية ٢٩ / ٢٤٧","volume":"29","page":247,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/9872?versionId=MT3i8pDNoM","confirm_url":null,"gradings":null},"search_log":[{"source":"usul.ai kuwaiti page","query":"apiIndex 9137 (27/260)","found":false},{"source":"usul.ai kuwaiti find","query":"عجز عن القعود صلى على جنبه","found":true},{"source":"usul.ai kuwaiti page","query":"apiIndex 9871 (حكم من عجز عن القعود، 29/247)","found":true},{"source":"usul.ai al-mughni find (sceptic: agreement wording sought)","query":"عجز عن الجلوس صلى على جنبه","found":false},{"source":"usul.ai al-majmu find (sceptic: agreement wording sought)","query":"عجز عن القعود صلى مضطجعا","found":true}]}],"continues":null}},{"i":8,"kind":"saying","timestamp":"00:47","timestamp_end":"00:52","quote":"عندما فرضت الصلاة الصحابة الكرام ماذا قالوا؟ قالوا قضيت الحوائج","old":null,"new":{"i":8,"flow_kind":"report","sub_kind":"sirah","state":"not_found","level":0,"line_ar":"قول منسوب إلى الصحابة عند فرض الصلاة: «قُضيت الحوائج»","line_en":"A saying attributed to the C amp_end":"00:59","quote":"رأى النبي صلى الله عليه وسلم أناسا مجتمعين فقال على ما اجتمع هؤلاء فقالوا يا رسول الله على قبر يحفرونه فهرول النبي صلى الله عليه وسلم إليهم ثم جلس على شفير القبر على حافة القبر ثم أخذ ينكأ بعصاة كانت معه عصاة صغيرة كانت معه الأرض قال الصحابي فاستقبلته من بين يديه حتى أرى ما يصنع قال فرأيته يبكي صلى الله عليه وسلم حتى بل الثرى … يبكي حتى بل الثرى ثم قال أي إخواني لمثل هذا فأعدوا لمثل هذا فأعدوا لمثل هذا فأعدوا","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":4,"line_ar":"حديث البراء في بكاء النبي ﷺ على القبر و«لمثل هذا فأعدّوا»، عند أحمد وابن ماجه","line_en":"Al-Bara's narration of the Prophet weeping at a grave, 'prepare for a day like this', in Ahmad and Ibn Majah.","reason_ar":"اختلف فيه المحدّثون: حسّن الألباني إسناده في السلسلة الصحيحة، وضعّفه شعيب الأرناؤوط في تخريج المسند (18601)، فرُتّب على الأضعف. أما النكت بالعود في الأرض فمن حديث البراء الآخر في القبر، وقد صحّحه الألباني (صحيح أبي داود 4753).","reason_en":"Graders differ: al-Albani rated the chain hasan (al-Silsila al-Sahiha 4/345) and Shu'ayb al-Arna'ut weak (Musnad 18601), so it is ranked at the weaker grade. The stick detail comes from al-Bara's grave hadith, which al-Albani graded sahih (Sahih Abi Dawud 4753).","load_bearing":true,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"رأى النبي صلى الله عليه وسلم أناسا مجتمعين فقال على ما اجتمع هؤلاء فقالوا يا رسول الله على قبر يحفرونه فهرول النبي صلى الله عليه وسلم إليهم ثم جلس على شفير القبر على حافة القبر … قال الصحابي فاستقبلته من بين يديه حتى أرى ما يصنع قال فرأيته يبكي صلى الله عليه وسلم حتى بل الثرى … يبكي حتى بل الثرى ثم قال أي إخواني لمثل هذا فأعدوا لمثل هذا فأعدوا لمثل هذا فأعدوا","text_ar":"رأى النبي ﷺ جماعةً يحفرون قبرًا فأسرع إليه وجثا عنده، فبكى حتى بلّ الثرى من دموعه، ثم قال: أي إخواني، لمثل هذا فأعدّوا.","text_en":"The Prophet ﷺ saw people digging a grave, hurried to it and knelt there, wept until his tears wet the soil, then said: 'My brothers, prepare for h the mushaf text of 29:69 word for word; stopping before the verse's last clause leaves its meaning intact.","load_bearing":false,"parts":[{"position":1,"kind":"verse","origin":"spoken","said_text":"وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا","text_ar":"قول الله تعالى: «والذين جاهدوا فينا لنهدينهم سبلنا» من سورة العنكبوت.","text_en":"Allah's words in al-'Ankabut: those who strive in Us, We will surely guide them to Our paths.","flow_kind":"quran","exit_id":"x_exact","state":"matches","level":1,"difference_ar":"مطابق لنص المصحف.","difference_en":"Matches the mushaf text.","source":{"site":"quran.com","link":"https://quran.com/29/69","quote":"وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":null,"gradings":null},"search_log":[{"source":"quran.com (verse_text 29:69 in the batch)","query":"والذين جاهدوا فينا لنهدينهم سبلنا","found":true}]}],"continues":null}}]},{"id":"c8376e53-a81f-42a4-b0f2-7473a3a7942e","title":"مجاهدة النفس","speaker":"الشيخ أمجد سمير","claims":[{"i":1,"kind":"hadith","timestamp":"00:28","timestamp_end":"00:41","quote":"إن حفت النار بالإيه؟ بالشهوات … لأن النار حفت بالشهوات","old":null,"new":{"i":1,"flow_kind":"hadith","sub_kind":null,"state":"matches","level":1,"line_ar":"حديث «حُفَّت النار بالشهوات» من صحيح مسلم، رواه المتحدث بشطره","line_en":"Hadith 'the Fire is surrounded by desires', from Sahih Muslim; the speaker gave its second half only.","reason_ar":"في صحيح مسلم (2822) عن أنس، وهو حديث متصل فيه، فهو صحيح بلا حاجة إلى حكم محدِّث.","reason_en":"Sahih Muslim 2822, from Anas, as a connected hadith, so it is sahih by the rule for the two Sahihs.","load_bearing":true,"parts":[{"position":1,"kind":"hadith","origin":"spoken","said_text":"إن حفت النار بالإيه؟ بالشهوات … لأن النار حفت بالشهوات","text_ar":"حُفَّت النار بالشهوات، وهو شطر حديث نبوي","text_en":"The Fire is surrounded by desires: one half of a hadith of the Prophet ﷺ.","flow_kind":"hadith","exit_id":"x_sahih","state":"matches","level":1,"difference_ar":"موافق للمصدر. جزءٌ من الحديث؛ تمامه في المصدر.","difference_en":"Matches the source. A portion of the hadith; the whole is in the source.","source":{"site":"dorar.net","link":"https://dorar.net/h/jbAML0Wf","quote":"حُفَّتِ الجَنَّةُ بالمَكارِه، وحُفَّتِ النَّارُ بالشَّهَواتِ .","collection":"صحيح مسلم","number":"2822","grader":"مسلم","grading":"[صحيح]","narrator":"أنس بن مالك","work_ar":null,"ref_ar":null,"volume":null,"page":null,"page_url":null,"confirm_url":"https://dorar.net/h/jAu3fLaP","gradings":null},"search_log":[{"source":"dorar.net","query":"حفت النار بالشهوات","found":true}]}],"continues":null}}]},{"id":"bdb4770b-d6aa-4999-a8e2-39599c78989f","title":"الشكوى","speaker":"الشيخ عبد السلام الشويعر","claims":[{"i":1,"kind":"ruling","timestamp":"00:00","timestamp_end":"00:05","quote":"لا تفسد أجرك بالتعب والمشقة بكثرة التسخط، فإن التسخط تذهب الأجر","old":null,"new":{"i":1,"flow_kind":"ruling","sub_kind":null,"state":"matches","level":5,"line_ar":"التسخط يُذهب أجر المشقة؛ الكويتية تنقله عن القرافي والعز","line_en":"Discontent over hardship forfeits its reward; the Kuwaiti Encyclopaedia gives this as al-Qarafi's and al-Izz's view.","reason_ar":"الموسوعة الكويتية (ج15 ص59) تذكر أن الثواب يجتمع مع التكفير إن صبر ورضي، وتنسبه إلى القرافي والعز بن عبد السلام لا إلى مذهب، فهو في الرتبة الخامسة بحسب المسار.","reason_en":"Kuwaiti Encyclopaedia 15/59 says reward joins expiation only with patience and contentment, attributed to al-Qarafi and al-Izz rather than a school, so level 5 by the sheet.","load_bearing":true,"parts":[{"position":1,"kind":"ruling","origin":"spoken","said_text":"لا تفسد أجرك بالتعب والمشقة بكثرة التسخط، فإن التسخط تذهب الأجر","text_ar":"التسخّط على المشقة والبلاء يُذهب أجر الصبر عليهما","text_en":"Discontent at fatigue and hardship takes away the reward one would have for them","flow_kind":"ruling","exit_id":"x_outside_as_only","state":"matches","level":5,"difference_ar":"قيل على أنه الحكم؛ والمصدر لا ينسبه إلى مذهب من الأربعة بل إلى القرافي والعز بن عبد السلام (وبمعناه تحقيقُ ابن حجر): المصائب كفّارةٌ سخط صاحبها أم رضي، ولا ثواب إلا مع الصبر والرضا؛ وتنقل الصفحة عن الحنفية أن ما وُعد به من الثواب على ألم المؤمن، حتى الشوكة يُشاكها، محضُ فضلٍ من الله.","difference_en":"Stated as the ruling; the source attributes it to none of the four schools but to al-Qarafi and al-Izz ibn Abd al-Salam (Ibn Hajar's verdict is similar): afflictions expiate sins whether one is discontent or content, and reward comes only with patience and contentment; the page also reports the Hanafis saying that the reward promised for a believer's pain, even a thorn's prick, is pure grace from Allah.","source":{"site":"usul.ai","link":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/4790?versionId=MT3i8pDNoM","quote":"الْمَصَائِبُ كَفَّارَاتٌ لِلذُّنُوبِ قَطْعًا، سَوَاءٌ أَسَخِطَ، أَمْ رَضِيَ، غَيْرَ أَنَّهُ إِنْ صَبَرَ وَرَضِيَ اجْتَمَعَ مَعَ التَّكْفِيرِ الثَّوَابُ","collection":null,"number":null,"grader":null,"grading":null,"narrator":null,"work_ar":"الموسوعة الفقهية الكويتية","ref_ar":"ج 15، ص 59","volume":"15","page":59,"page_url":"https://usul.ai/t/kuwaiti-encyclopedia-of-jurisprudence/4790?versionId=MT3i8pDNoM","confirm_url":null,"gradings":null},"search_log":[{"source":"usul.ai Kuwaiti (toc)","query":"شكوى","found":false},{"source":"usul.ai Kuwaiti (toc)","query":"تسخط","found":false},{"source":"usul.ai Kuwaiti (toc)","query":"صبر","found":false},{"source":"usul.ai Kuwaiti (toc)","query":"مصيبة (vol 38 p.32 refers to استرجاع; vol 3 p.282 states patience is wajib, not the reward case)","found":false},{"source":"usul.ai Kuwaiti (find)","query":"التسخط","found":false},{"source":"shamela al-majmu / al-mughni / kuwaiti / al-ashbah","query":"الجزع يحبط الأجر","found":false},{"source":"shamela al-majmu / al-mughni / kuwaiti","query":"التسخط (retried; Shamela empty even for common words   function renderAll() {
    document.body.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.documentElement.lang = lang;
    $('lang-ar').setAttribute('aria-pressed', String(lang === 'ar')); $('lang-en').setAttribute('aria-pressed', String(lang === 'en'));
    $('h1').textContent = t('h1'); $('sub').textContent = t('sub'); $('note').textContent = DATA.note ? pick(DATA.note.ar, DATA.note.en) : '';
    $('chips').innerHTML = DATA.videos.map((v) => `<button type="button" class="chip" role="tab" data-vid="${esc(v.id)}" aria-selected="false" title="${esc(v.title)}">${esc(v.title).slice(0, 34)}<b id="cnt-${esc(v.id)}">0/${v.claims.length}</b></button>`).join('');
    $('sections').innerHTML = DATA.videos.map((v) => `<section id="sec-${esc(v.id)}" hidden><h2>${esc(v.title)}</h2><p class="sub">${esc(v.speaker || '')} · ${v.claims.length} ${t('claims')}</p>${v.claims.map((c) => claimCard(v, c)).join('')}</section>`).join('');
    const all = DATA.videos.flatMap((v) => v.claims.filter((c) => c.new));
    const tally = {}; for (const c of all) tally[c.new.state] = (tally[c.new.state] || 0) + 1;
    $('stats').innerHTML = Object.entries(tally).sort((a, b) => b[1] - a[1]).map(([s, n]) => `<span class="stat">${esc(L[lang].statesLbl[s] || s)}: ${n}</span>`).join('') + `<span class="stat">${all.length} ${t('claims')}</span>`;
    applyState(); applyPills(); playerLabels();
    for (const [k, b] of state) { const card = document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); const box = card && card.querySelector('.editbox'); if (box && b.edit && !box.value) box.value = b.edit; }
  }
  function applyState() {
    for (const card of document.querySelectorAll('.card[data-key]')) { const b = state.get(card.dataset.key); const v = b ? b.decision : null; card.dataset.state = v ? 'decided' : ''; for (const btn of card.querySelectorAll('.btn')) btn.setAttribute('aria-pressed', String(btn.dataset.v === v)); const box = card.querySelector('.editbox'); if (box) box.hidden = v !== 'edit'; }
    let all = 0, done = 0;
    for (const v of DATA.videos) { const n = v.claims.filter((c) => state.has(key(v.id, c.i))).length; all += v.claims.length; done += n; const c = $('cnt-' + v.id); if (c) c.textContent = n + '/' + v.claims.length; }
    const cur = DATA.videos.find((v) => v.id === current); const one = cur && cur.claims.every((c) => state.has(key(cur.id, c.i)));
    $('done').hidden = !(done === all || one); $('done').textContent = done === all ? t('done') : t('doneOne');
  }
  function show(vid) { if (playing && playing.vid !== vid) stopPlayer(); current = vid; for (const c of document.querySelectorAll('.chip')) c.setAttribute('aria-selected', String(c.dataset.vid === vid)); for (const s of document.querySelectorAll('#sections > section')) s.hidden = s.id !== 'sec-' + vid; try { localStorage.setItem('deeni-v2-vid', vid); } catch {} applyState(); }
  function mark(card, msg) { const el = card.querySelector('.saved'); if (el) el.textContent = msg; }
  async function save(k, body, card) { state.set(k, body); applyState(); if (!db) { mark(card, dbAbsent ? t('unsaved') : t('saving')); return; } mark(card, t('saving')); try { await db.doc('claims/' + k).set(body); mark(card, t('saved')); } catch { mark(card, t('unsaved')); } }
  function clear(k, card) { state.delete(k); applyState(); mark(card, ''); if (db) db.doc('claims/' + k).delete().catch(() => {}); }
  document.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip'); if (chip) { show(chip.dataset.vid); return; }
    const tp = e.target.closest('.time'); if (tp) { const i = Number(tp.dataset.i); if (playing && playing.vid === tp.dataset.vid && playing.i === i) { stopPlayer(); return; } seek(tp.dataset.vid, i, Number(tp.dataset.s), tp.textContent.trim()); return; }
    if (e.target.closest('#phide')) { stopPlayer(); return; }
    const btn = e.target.closest('.btn'); if (!btn) return; const card = btn.closest('.card'); const k = card.dataset.key, v = btn.dataset.v; const cur = state.get(k);
    if (cur && cur.decision === v) { clear(k, card); return; }
    const box = card.querySelector('.editbox'); const body = { decision: v, at: new Date().toISOString() }; if (v === 'edit') body.edit = box.value; save(k, body, card); if (v === 'edit') setTimeout(() => box.focus(), 0);
  });
  document.addEventListener('input', (e) => { const box = e.target.closest('.editbox'); if (!box) return; const card = box.closest('.card'); const k = card.dataset.key; clearTimeout(timers.get(k)); timers.set(k, setTimeout(() => save(k, { decision: 'edit', edit: box.value, at: new Date().toISOString() }, card), 700)); });
  $('lang').addEventListener('click', (e) => { const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return; lang = b.dataset.lang; try { localStorage.setItem('deeni-v2-lang', lang); } catch {} renderAll(); show(current || DATA.videos[0].id); });
  renderAll(); let start = DATA.videos[0].id; try { const s = localStorage.getItem('deeni-v2-vid'); if (s && DATA.videos.some((v) => v.id === s)) start = s; } catch {} show(start);
  (async () => {
    db = await window.claude?.use?.('db');
    if (!db) { dbAbsent = true; return; }
    db.collection('claims').onSnapshot((snap) => { for (const d of snap.docs) { const b = d.data(); if (b && b.decision) state.set(d.id, b); } for (const ch of snap.docChanges()) if (ch.type === 'removed') state.delete(ch.doc.id); applyState(); for (const [k, b] of state) { const card = document.querySelector(`.card[data-key="${CSS.escape(k)}"]`); const box = card && card.querySelector('.editbox'); if (box && b.edit && document.activeElement !== box) box.value = b.edit; } }, () => {});
  })();
</script>
